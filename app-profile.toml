# Tile Lite Elite's technical profile: the facts about this repository that the
# programme's tooling asks for (programme/scripts/board/profile.py,
# delphside/tile-lite-elite#485 stage 2). It changes on a project's branch with
# the code it describes. What the programme's processes need to know about the
# application (name, repository, environments' purposes, routes) is its
# programme profile, 3.1.6 in the programme repository; this file says how to
# reach it. Paths are relative to this file's folder.

# The application's folder in the programme repository's `applications/`.
application = "tile-lite-elite"

[versions]
# The subject of every commit starts with this stamp. Group 1 is the app
# version, group 2 the api version, group 3 the rest of the subject.
stamp = '^app ([0-9]+\.[0-9]+\.[0-9]+) api ([0-9]+\.[0-9]+): (.+)'
# The stamp as a message shows it.
stamp_form = "app <X.Y.Z> api <M.N>: <subject>"

[versions.app]
# The first line of `file` matching `pattern` holds the app version (group 1).
file = "Cargo.toml"
pattern = '^version\s*=\s*"([^"]+)"'

[versions.api]
# `command` reads `file` on stdin and prints the api version, `M.N`.
file = "crates/api/src/lib.rs"
command = "scripts/deliver/read-api-version.sh"

[versions.bump]
# A change is a version bump only when it touches `required` and optionally the
# rest of `files`, and every changed line matches `line`.
files = ["Cargo.toml", "Cargo.lock"]
required = ["Cargo.toml"]
line = '^[-+]version = "[0-9]+\.[0-9]+\.[0-9]+"$'

[versions.deployed]
# A running environment reports its version, `X.Y.Z+<sha>`, at `path` in `field`.
path = "/health"
field = "app_version"

[ships]
# The image carries Turpin's payload (the hooks, the host files' sources, the
# joined files and the profile keys a host reads), so a move of the programme
# pin or an edit to this file ships only where it changes what a host reads
# (delphside/tile-lite-elite#556).
carries_payload = true
# What does NOT reach the image; every other path does. Regular expressions,
# each matched from the start of the path.
#
# `docs/`, `scripts/` and `.*\.md$` do not ship, except the host files' sources
# (`[[turpin.host_files]]`): those are copied into the payload, so they are the
# image's. Each exception is a negative lookahead; a new host file owes its
# source an entry here and a case in scripts/tests/shipping-paths.bats.
non_shipping = [
  'docs/(?!4\.4\.7-log-events\.md$)',
  'scripts/(?!operate/(backup-to-oci\.sh$|check-log-hygiene-nightly\.sh$|check-log-hygiene\.py$|upload\.sh$|systemd/tile-lite-elite-(backup|log-check)\.(service|timer)$|profile\.d/tile-lite-elite-sa\.sh$))',
  'e2e/',
  '\.github/',
  '\.githooks/',
  '\.claude/',
  '\.cargo/audit\.toml$',
  'crates/[^/]+/(examples|tests|benches)/',
  'LICENSE',
  '\.gitignore$',
  '\.markdownlint',
  '(?!docs/4\.4\.7-log-events\.md$).*\.md$',
  # the programme submodule (#485): the Dockerfile copies named folders, never this one
  '\.gitmodules$',
  'programme$',
  'programme/',
  # the hooks' tests; the hooks themselves are the payload's
  'turpin/tests/',
]

[scripts]
# The application's own scripts, in four folders that follow the workstreams that
# own them (#447's grouping). A commit to `main` touching one is warned about, not
# refused: the pre-commit hook asks `board-shipping.py application-tooling`.
groups = [
  "scripts/develop/",
  "scripts/deliver/",
  "scripts/operate/",
  "scripts/measure/",
]

[environments.preview]
# A variable that overrides, in order, then the default.
env = ["PREVIEW_URL", "STAGING_URL"]
url = "http://localhost:8081"
# Turpin's keys: the laptop is its host, Compose runs under this project name,
# and the environment joins its own compose file and Caddyfile.
role = "preview"
host = "controller"
project = "tile-lite-elite-preview"
join = ["docker-compose.preview.yml", "Caddyfile.preview"]

[environments.rehearsal]
env = ["REHEARSAL_URL"]
# The script is sourced in a subshell and `url_variable` read from it.
url_from = "scripts/deliver/rehearsal-target.sh"
url_variable = "TARGET_URL"
# Turpin's keys. The project is the name docker-compose.yml pins, so the first
# deploy recreates the running containers in place; the volumes keep their names.
role = "rehearsal"
login = "oci-instance-principal"
project = "tile-lite-elite"
# As production's, from the same measurement.
pull_timeout = 60

[environments.production]
env = ["PROD_URL"]
# Turpin's keys. `url` is where `/health` is read and what a host's `smoke`
# and `post-deploy` hooks are given.
role = "production"
login = "oci-instance-principal"
project = "tile-lite-elite"
url = "https://tileliteelite.com"
# Rehearsal's cold pulls of both images, login included, took 16 s and 18 s
# (2026-11-18, #555 S36): about three times the first.
pull_timeout = 60

[hosts.production]
# Read by programme/scripts/board/board-hosts.py over ssh, read-only (#360).
# The hosts are the infrastructure application's; this says which are this
# application's and how to reach them.
ssh = "tile-lite-elite"
env = ["PROD_SSH_HOST"]

[hosts.rehearsal]
ssh = "tile-lite-elite-rehearsal"
env = ["REHEARSAL_SSH_HOST"]
# Its kernel and Docker should match production's, except while an upgrade is
# being proven here first.
compare_with = "production"

[release]
# A release is tagged `<tag_prefix><X.Y.Z>`.
tag_prefix = "v"
# Earlier tags: history, release notes, version order, production's tag.
history_prefixes = ["prod-"]
# What a deploy announces on an issue: a comment starting with `announcement`
# (also matched with each history prefix), or with `deploy_marker`.
announcement = "Released in v"
deploy_marker = "[deploy.sh]"
# Prints why CI is red on main and exits non-zero, or exits 0.
ci_status = "scripts/deliver/ci-status.sh --run push:main"
# The check names are the CI jobs' `name:` values, which the release gate and
# GitHub match: the jobs keep them.
required_checks = [
  "fmt · clippy · test · wasm · docs",
  "commit stamp (app/api versions)",
  "e2e (Playwright · preview stack)",
]
# Hooks in turpin/hooks/ that a release or a deploy refuses without.
required_hooks = ["build", "pre-deploy", "save-state", "migrate", "smoke", "restore-state", "release-check", "bump"]
overridable = ["milestone"]

[turpin]
# Turpin's registry repositories, the image set, and which image carries the
# payload at /turpin/. `join` names the files a deploy joins into its folder,
# taken from the payload, never a working tree; an environment adds its own.
candidates = "tile-lite-elite/candidates"
releases = "tile-lite-elite/releases"
images = ["server", "web"]
payload_image = "server"
join = ["docker-compose.yml", "Caddyfile"]
# What a failed first deploy on an adopted host prints.
fallback = "see docs/4.3.3, Roll back a first Turpin deploy"

[turpin.build]
# Build arguments, each taken from a value of the build (`SHORT_SHA` is the
# commit's first seven characters). The `build` hook sets this one itself too.
args = { TILE_LITE_ELITE_BUILD_ID = "SHORT_SHA" }

# The host files (scripts/operate/): installed on rehearsal and production at
# each deploy. A unit marked `enable` is enabled and restarted. Their sources
# ship in the image, which `[ships]` above says.
[[turpin.host_files]]
src = "scripts/operate/backup-to-oci.sh"
dest = "/opt/tile-lite-elite/backup-to-oci.sh"
mode = "0755"

[[turpin.host_files]]
src = "scripts/operate/check-log-hygiene-nightly.sh"
dest = "/opt/tile-lite-elite/check-log-hygiene-nightly.sh"
mode = "0755"

[[turpin.host_files]]
src = "scripts/operate/upload.sh"
dest = "/opt/tile-lite-elite/upload.sh"
mode = "0755"

[[turpin.host_files]]
src = "scripts/operate/check-log-hygiene.py"
dest = "/opt/tile-lite-elite/check-log-hygiene.py"
mode = "0755"

[[turpin.host_files]]
src = "docs/4.4.7-log-events.md"
dest = "/opt/tile-lite-elite/4.4.7-log-events.md"
mode = "0644"

[[turpin.host_files]]
src = "scripts/operate/systemd/tile-lite-elite-backup.service"
dest = "/etc/systemd/system/tile-lite-elite-backup.service"
mode = "0644"

[[turpin.host_files]]
src = "scripts/operate/systemd/tile-lite-elite-log-check.service"
dest = "/etc/systemd/system/tile-lite-elite-log-check.service"
mode = "0644"

[[turpin.host_files]]
src = "scripts/operate/systemd/tile-lite-elite-backup.timer"
dest = "/etc/systemd/system/tile-lite-elite-backup.timer"
mode = "0644"
enable = true

[[turpin.host_files]]
src = "scripts/operate/systemd/tile-lite-elite-log-check.timer"
dest = "/etc/systemd/system/tile-lite-elite-log-check.timer"
mode = "0644"
enable = true

[[turpin.host_files]]
src = "scripts/operate/profile.d/tile-lite-elite-sa.sh"
dest = "/etc/profile.d/tile-lite-elite-sa.sh"
mode = "0644"

[documents]
# Generated from the code or the board: neither the programme's nor the
# application's to edit by hand.
generated = ["docs/4.1.5-work-in-progress.md", "docs/4.1.6-document-map.md"]
# The document map, and the roadmap document the diagram is written into.
map = "docs/4.1.6-document-map.md"
roadmap = "docs/4.1.5-work-in-progress.md"
# The application's register of tooling: a new script or skill must be named in
# it or in the programme's (`programme_documents.tools_register`).
tools_registers = ["docs/4.3.0-tools.md"]
# The line in a reference document that gives the commit it was last read whole at.
review_stamp = 'Reviewed whole at `([0-9a-f]+)`'
# The programme's documents that live here besides the programme's own
# (`programme_documents` in the programme file), which change on main: exact
# paths, then prefixes.
programme_exact = ["docs/diagrams/roadmap.svg"]  # generated from the roadmap
programme_prefixes = ["docs/4.1.4-"]
# Documents outside docs/ that describe the application.
application_outside_docs = ["README.md"]
# (The change documents already in a flat folder, which stay, are the programme file's
# `records.grandfathered_changes`: the programme repository's CI needs them without an application.)
# What the markdown linter skips, besides the programme's own folders.
lint_ignore = ["#target", "#**/node_modules", "#old-crates", "#pipeline.md"]

# The stamped reference documents, in order, for the reference reviewer and the
# weekly reference-review (programme docs 1.4): `files` are what `git log
# <stamp>..HEAD --` takes, and `read` is what in them to compare the document with.
[[documents.reference]]
document = "docs/4.4.1-configuration.md"
files = ["crates/", "docker-compose.yml", "docker-compose.preview.yml", "Dockerfile", "Caddyfile", "Caddyfile.preview", "Cargo.lock", "rust-toolchain.toml", ".cargo/config.toml", ".dockerignore"]
read = "every `env::var`, `option_env!` and `*_from_env` in `crates/`; `docker-compose.yml`, `docker-compose.preview.yml`, `Dockerfile`, `Caddyfile`, `Caddyfile.preview`, `rust-toolchain.toml`, `.cargo/config.toml`; `crates/server-game/src/persistence.rs` (`connect`); `crates/server-game/src/app/throttle.rs`; for sqlx defaults, `sqlx-sqlite`'s `src/options/mod.rs` under `~/.cargo/registry/src/` at the version in `Cargo.lock`"

[[documents.reference]]
document = "docs/4.4.2-database-schema.md"
files = ["crates/server-game/migrations/", "crates/server-game/src/persistence.rs"]
read = "`crates/server-game/migrations/*.sql`, applied in order to a scratch SQLite database with Python's `sqlite3` module, then `pragma table_info` per table; `persistence.rs` for how columns are written"

[[documents.reference]]
document = "docs/4.4.3-api-schema.md"
files = ["crates/server-game/src/app.rs", "crates/server-game/src/app/", "crates/api/src/lib.rs"]
read = "the `.route(` calls in `crates/server-game/src/app.rs` and `app/*.rs` (not test modules); each handler's body for how it authenticates; `crates/api/src/lib.rs` for every DTO"

[[documents.reference]]
document = "docs/4.4.4-snapshot-json-schema.md"
files = ["crates/server-game/src/persistence.rs", "crates/server-game/src/game_state.rs", "crates/rules-shared/src/model.rs"]
read = "`PersistedGame` and `PersistedVariantRules` in `persistence.rs`; `ParticipantState`, `MoveRecord`, `ChatMessageRecord` in `game_state.rs`; `VariantRules::EDITION_NAMES` in `crates/rules-shared/src/model.rs`"

[[documents.reference]]
document = "docs/4.4.5-data-dictionary.md"
files = ["crates/server-game/src/persistence.rs", "crates/server-game/src/game_state.rs", "crates/rules-shared/src/model.rs", "crates/api/src/lib.rs", "crates/server-game/migrations/", "crates/server-game/src/app/games.rs"]
read = "the same structs as 4.4.4, the DTOs in `crates/api/src/lib.rs`, the migrations' columns, and `app/games.rs` for fields computed per request"

[[documents.reference]]
document = "docs/4.4.6-client-local-storage.md"
files = ["crates/ui/src/"]
read = "`crates/ui/src/local_storage.rs` and its callers in `crates/ui/src/` (`app.rs` and the components)"

[[documents.reference]]
document = "docs/4.4.7-log-events.md"
files = ["crates/", "scripts/"]
read = "every `tracing` event in `crates/server-game/src/` (not test modules); every `run_log_event` call in `scripts/`; the schema block against `scripts/operate/check-log-hygiene.py` and `scripts/develop/check-run-log-events.py`"

[source]
# Where the source is, for the reviewers (`git log <stamp>..HEAD -- <globs>`).
globs = ["crates/"]
# What the test designer must not read.
implementation = ["crates/*/src/"]

[[hooks.pre_commit]]
# Run when a staged path matches `staged`, `requires_file` exists and
# `requires_command` is installed; a non-zero exit refuses the commit.
name = "rustfmt"
staged = '\.rs$'
requires_file = "Cargo.toml"
requires_command = "cargo"
command = "cargo fmt --all -- --check"
refusal = "rustfmt would change staged Rust."
fix = "Run 'cargo fmt --all' and stage the result. CI denies this, so the alternative is a red build and a release gate that refuses the commit."

[[hooks.check_docs]]
# The application's own documentation checks, run by check-docs.sh in order.
name = "API errors"
command = "scripts/develop/check-api-errors.py"

[[hooks.check_docs]]
name = "script log events"
command = "scripts/develop/check-run-log-events.py"
