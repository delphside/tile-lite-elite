# Tile Lite Elite's technical profile: the facts about this repository that the
# programme's tooling asks for (programme/scripts/board/profile.py,
# delphside/tile-lite-elite#485 stage 2). It changes on a project's branch with
# the code it describes. What the programme's processes need to know about the
# application (name, repository, environments' purposes, routes) is its
# programme profile, 3.1.6 in the programme repository; this file says how to
# reach it. Paths are relative to this file's folder.

# The application's folder in the programme repository's `applications/`.
application = "tile-lite-elite"

[versions]
# The subject of every commit starts with this stamp. Group 1 is the app
# version, group 2 the api version, group 3 the rest of the subject.
stamp = '^app ([0-9]+\.[0-9]+\.[0-9]+) api ([0-9]+\.[0-9]+): (.+)'
# The stamp as a message shows it.
stamp_form = "app <X.Y.Z> api <M.N>: <subject>"

[versions.app]
# The first line of `file` matching `pattern` holds the app version (group 1).
file = "Cargo.toml"
pattern = '^version\s*=\s*"([^"]+)"'

[versions.api]
# `command` reads `file` on stdin and prints the api version, `M.N`.
file = "crates/api/src/lib.rs"
command = "scripts/deliver/read-api-version.sh"

[versions.bump]
# A change is a version bump only when it touches `required` and optionally the
# rest of `files`, and every changed line matches `line`.
files = ["Cargo.toml", "Cargo.lock"]
required = ["Cargo.toml"]
line = '^[-+]version = "[0-9]+\.[0-9]+\.[0-9]+"$'

[versions.deployed]
# A running environment reports its version, `X.Y.Z+<sha>`, at `path` in `field`.
path = "/health"
field = "app_version"

[ships]
# What does NOT reach the image; every other path does. Regular expressions,
# each matched from the start of the path.
non_shipping = [
  'docs/',
  'scripts/',
  'e2e/',
  '\.github/',
  '\.githooks/',
  '\.claude/',
  '\.cargo/audit\.toml$',
  'crates/[^/]+/(examples|tests|benches)/',
  'LICENSE',
  '\.gitignore$',
  '\.markdownlint',
  '.*\.md$',
  # the programme submodule (#485): the Dockerfile copies named folders, never this one
  '\.gitmodules$',
  'programme$',
  'programme/',
  # this file: the Dockerfile copies named files and folders, never this one
  'programme\.toml$',
]

[scripts]
# The application's own scripts, in four folders that follow the workstreams that
# own them (#447's grouping). A commit to `main` touching one is warned about, not
# refused: the pre-commit hook asks `board-shipping.py application-tooling`.
groups = [
  "scripts/develop/",
  "scripts/deliver/",
  "scripts/operate/",
  "scripts/measure/",
]

[environments.preview]
# A variable that overrides, in order, then the default.
env = ["PREVIEW_URL", "STAGING_URL"]
url = "http://localhost:8081"

[environments.rehearsal]
env = ["REHEARSAL_URL"]
# The script is sourced in a subshell and `url_variable` read from it.
url_from = "scripts/deliver/rehearsal-target.sh"
url_variable = "TARGET_URL"

[environments.production]
env = ["PROD_URL"]

[release]
# A release is tagged `<tag_prefix><X.Y.Z>`.
tag_prefix = "prod-"
# What a deploy announces on an issue: a comment starting with `announcement`,
# or with `deploy_marker`.
announcement = "Released in prod-"
deploy_marker = "[deploy.sh]"
# Prints why CI is red on main and exits non-zero, or exits 0.
ci_status = "scripts/deliver/ci-status.sh --run push:main"

[documents]
# Generated from the code or the board: neither the programme's nor the
# application's to edit by hand.
generated = ["docs/4.1.5-work-in-progress.md", "docs/4.1.6-document-map.md"]
# The document map, and the roadmap document the diagram is written into.
map = "docs/4.1.6-document-map.md"
roadmap = "docs/4.1.5-work-in-progress.md"
# The application's register of tooling: a new script or skill must be named in
# it or in the programme's (`programme_documents.tools_register`).
tools_registers = ["docs/4.3.0-tools.md"]
# The line in a reference document that gives the commit it was last read whole at.
review_stamp = 'Reviewed whole at `([0-9a-f]+)`'
# The programme's documents that live here besides the programme's own
# (`programme_documents` in the programme file), which change on main: exact
# paths, then prefixes.
programme_exact = ["docs/diagrams/roadmap.svg"]  # generated from the roadmap
programme_prefixes = ["docs/4.1.4-"]
# Documents outside docs/ that describe the application.
application_outside_docs = ["README.md"]
# (The change documents already in a flat folder, which stay, are the programme file's
# `records.grandfathered_changes`: the programme repository's CI needs them without an application.)
# What the markdown linter skips, besides the programme's own folders.
lint_ignore = ["#target", "#**/node_modules", "#old-crates", "#pipeline.md"]

# The stamped reference documents, in order, for the reference reviewer and the
# weekly reference-review (programme docs 1.4): `files` are what `git log
# <stamp>..HEAD --` takes, and `read` is what in them to compare the document with.
[[documents.reference]]
document = "docs/4.4.1-configuration.md"
files = ["crates/", "docker-compose.yml", "docker-compose.preview.yml", "Dockerfile", "Caddyfile", "Cargo.lock"]
read = "every `env::var`, `option_env!` and `*_from_env` in `crates/`; `docker-compose.yml`, `docker-compose.preview.yml`, `Dockerfile`, `Caddyfile`; `crates/server-game/src/persistence.rs` (`connect`); `crates/server-game/src/app/throttle.rs`; for sqlx defaults, `sqlx-sqlite`'s `src/options/mod.rs` under `~/.cargo/registry/src/` at the version in `Cargo.lock`"

[[documents.reference]]
document = "docs/4.4.2-database-schema.md"
files = ["crates/server-game/migrations/", "crates/server-game/src/persistence.rs"]
read = "`crates/server-game/migrations/*.sql`, applied in order to a scratch SQLite database with Python's `sqlite3` module, then `pragma table_info` per table; `persistence.rs` for how columns are written"

[[documents.reference]]
document = "docs/4.4.3-api-schema.md"
files = ["crates/server-game/src/app.rs", "crates/server-game/src/app/", "crates/api/src/lib.rs"]
read = "the `.route(` calls in `crates/server-game/src/app.rs` and `app/*.rs` (not test modules); each handler's body for how it authenticates; `crates/api/src/lib.rs` for every DTO"

[[documents.reference]]
document = "docs/4.4.4-snapshot-json-schema.md"
files = ["crates/server-game/src/persistence.rs", "crates/server-game/src/game_state.rs", "crates/rules-shared/src/model.rs"]
read = "`PersistedGame` and `PersistedVariantRules` in `persistence.rs`; `ParticipantState`, `MoveRecord`, `ChatMessageRecord` in `game_state.rs`; `VariantRules::EDITION_NAMES` in `crates/rules-shared/src/model.rs`"

[[documents.reference]]
document = "docs/4.4.5-data-dictionary.md"
files = ["crates/server-game/src/persistence.rs", "crates/server-game/src/game_state.rs", "crates/rules-shared/src/model.rs", "crates/api/src/lib.rs", "crates/server-game/migrations/", "crates/server-game/src/app/games.rs"]
read = "the same structs as 4.4.4, the DTOs in `crates/api/src/lib.rs`, the migrations' columns, and `app/games.rs` for fields computed per request"

[[documents.reference]]
document = "docs/4.4.6-client-local-storage.md"
files = ["crates/ui/src/"]
read = "`crates/ui/src/local_storage.rs` and its callers in `crates/ui/src/` (`app.rs` and the components)"

[source]
# Where the source is, for the reviewers (`git log <stamp>..HEAD -- <globs>`).
globs = ["crates/"]
# What the test designer must not read.
implementation = ["crates/*/src/"]

[[hooks.pre_commit]]
# Run when a staged path matches `staged`, `requires_file` exists and
# `requires_command` is installed; a non-zero exit refuses the commit.
name = "rustfmt"
staged = '\.rs$'
requires_file = "Cargo.toml"
requires_command = "cargo"
command = "cargo fmt --all -- --check"
refusal = "rustfmt would change staged Rust."
fix = "Run 'cargo fmt --all' and stage the result. CI denies this, so the alternative is a red build and a release gate that refuses the commit."

[[hooks.check_docs]]
# The application's own documentation checks, run by check-docs.sh in order.
name = "API errors"
command = "scripts/develop/check-api-errors.py"

[[hooks.check_docs]]
name = "script log events"
command = "scripts/develop/check-run-log-events.py"
