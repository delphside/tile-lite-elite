# Gives a new requirement its Requirement State, Triage, when it is opened or typed.
#
# The model reads an unset Requirement State as Triage, but the board shows it blank, so a
# view filtered by Requirement State hides a requirement until somebody sets it. Owner,
# 2026-09-29: "yes for a Requirement Issue. Other issue types use different
# lifecycle fields." Which issues and which value is the model's
# (`Requirement.stage_to_record`); this only says when.
#
# `typed` as well as `opened`, because an issue can be typed after it is
# created. A set Requirement State is never overwritten.
#
# **It needs `BOARD_TOKEN`**, as `pr-state.yml` does: the automatic token
# cannot write an organisation's issue fields.
name: Requirement stage

on:
  issues:
    types: [opened, typed]
  workflow_dispatch:
    inputs:
      issue:
        description: issue number
        required: true

permissions:
  contents: read
  issues: write

jobs:
  stage:
    name: record a new requirement's Requirement State
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The pinned programme: its programme file (config/programme.toml), #485.
          submodules: true

      # The programme's records, at the head of its main: this application's
      # programme profile is read there. `PROGRAMME_DIR` is the variable
      # `scripts/programme/board/records.py` reads.
      - uses: actions/checkout@v7
        with:
          repository: delphside/programme
          ref: main
          path: .programme-live

      - name: Point the scripts at the programme's records
        run: echo "PROGRAMME_DIR=$GITHUB_WORKSPACE/.programme-live" >> "$GITHUB_ENV"

      - name: Record
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: python3 scripts/programme/board/board-stage.py "$ISSUE"
