# A second fake technical profile that differs from the first where the tests
# need to show a value is read: a different stamp, tag prefix and ships list.
application = "widget"

[versions]
stamp = '^v([0-9]+) / ([0-9]+): (.+)'
stamp_form = "v<N> / <M>: <subject>"

[versions.app]
file = "VERSION"
pattern = '^app=(\S+)'

[versions.api]
file = "API"
command = "scripts/api-version.sh"

[versions.bump]
files = ["VERSION", "VERSION.lock"]
required = ["VERSION"]
line = '^[-+]app=[0-9]+$'

[versions.deployed]
path = "/version"
field = "v"

[ships]
non_shipping = ['spec/', 'tools/', '.*\.txt$']

[release]
tag_prefix = "v-"
announcement = "Out as v-"
deploy_marker = "[out]"
ci_status = "tools/ci --main"
